[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
ignore_whitespace = true

[tool.mypy]
python_version = 3.10
show_error_context = true
pretty = true
show_column_numbers = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = ['docs/']

[tool.poetry]
name = "volttron-presentation-service"
version = "0.2"
description = ""
authors = ["David Raker <david.raker@pnnl.gov>"]
license = "Apache License 2.0"
readme = "README.md"
#repository = "https://github.com/eclipse-volttron"
#homepage = "https://github.com/eclipse-volttron/volttron-interoperability"
keywords = []
packages = [ { include = "presentation", from = "src"} ]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: Apache Software License"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
volttron-core = ">=2.0.0rc30" # {path="/home/dmr/Projects/volttron-modular/core/volttron-core", develop=true}  # ">=10.0.5rc0,<11.0"
convtools = ">=1.14.7"
pydantic = "2.11.9"
pyparsing = ">=3.2.5"
treelib = "1.8.0"


#[tool.poetry.group.dev.dependencies]
#volttron-testing = "^0.4.0rc0"
#pytest = "^6.2.5"
#pytest-cov = "^3.0.0"
#mock = "^4.0.3"
#pre-commit = "^2.17.0"
#yapf = "^0.32.0"
#toml = "^0.10.2"
#mypy = "^0.942"
#coverage = "^6.3.2"
#isort = "^5.10.1"

#[tool.poetry.group.docs.dependencies]
#Sphinx = "^4.5.0"
#sphinx-rtd-theme = "^1.0.0"

[tool.poetry.scripts]
volttron-presentation-service = "presentation.agent:main"

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 99
split_before_logical_operator = true

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**"
]
