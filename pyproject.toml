[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "interoperability-service"
version = "0.2"
description = "The interoperability service: resources, formats and the transforms between them, with discovery."
authors = [{name = "David Raker", email = "david.raker@pnnl.gov"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
]
dependencies = [
    "volttron-core>=2.0.0rc30",
    "networkx>=3.0",   # TODO: Up this to >=3.6 once VOLTTRON does not need to support python 3.10 anymore.
    "pydantic>=2.11",
    "icm-lib-transforms>=0.1.0",
    "icm-lib-resources>=0.1.0",
    "icm-lib-models-sunspec>=0.1.0",
    "icm-lib-models-ieee1815-2>=0.1.0",
    "icm-lib-models-ieee2030-5>=0.1.0",
    "icm-lib-models-openfmb>=0.1.0",
    "treelib>=1.8",
]

[project.optional-dependencies]
# discovery: the SunSpec discovery tooling (interoperability.discovery.sunspec) needs pysunspec2.
# openfmb: protobuf encoding of OpenFMB profiles (icm.resources.codecs, through icm-lib-resources) needs the protobuf runtime.
discovery = ["pysunspec2>=1.3"]
openfmb = ["protobuf>=6.31.1"]

[project.scripts]
interoperability-service = "interoperability.agent:main"

[project.urls]
Repository = "https://github.com/interoperability-control-modules/interoperability-service"
Homepage = "https://github.com/interoperability-control-modules/interoperability-service"

[tool.poetry]
packages = [{ include = "interoperability", from = "src" }]

[tool.isort]
profile = "black"
ignore_whitespace = true

[tool.mypy]
python_version = 3.10
show_error_context = true
pretty = true
show_column_numbers = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
exclude = ['docs/']

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.yapf]
based_on_style = "pep8"
spaces_before_comment = 4
column_limit = 99
split_before_logical_operator = true

[tool.yapfignore]
ignore_patterns = [
    ".venv/**",
    ".pytest_cache/**",
    "dist/**",
    "docs/**"
]
